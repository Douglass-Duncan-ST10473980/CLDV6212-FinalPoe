# Author: Tahir Ismail - ST10471483
# CoffeeNChill CI/CD pipeline (GitHub Actions).
#
# On every push to main:
#   1. build   - restores and builds the whole solution and runs the unit tests
#   2. publish - builds both Docker images and pushes them to Docker Hub with a version tag
#                (v3.<run number>, e.g. v3.12) and the v3.0 tag
#   3. deploy  - connects to the Azure VPS over SSH, pulls the new images and restarts the stack
#   4. verify  - runs the 39 end-to-end tests (test-gateway.ps1) against the live public URL
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub username (tahirismail)
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write access
#   VPS_HOST            Public IP address of the VPS (40.127.11.155)
#   VPS_USER            SSH user on the VPS (azureuser)
#   VPS_SSH_KEY         Private key of the dedicated GitHub Actions deploy key

name: CI/CD - Build, publish and deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Never run two deployments at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_TAG: v3.${{ github.run_number }}
  GATEWAY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-gateway
  FUNCTIONS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions

jobs:
  build:
    name: Build and test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "CoffeeNChill - CLDV6212.sln"

      - name: Build the solution
        run: dotnet build "CoffeeNChill - CLDV6212.sln" --configuration Release --no-restore

      - name: Run unit tests (any test projects in the solution)
        run: dotnet test "CoffeeNChill - CLDV6212.sln" --configuration Release --no-build --verbosity normal

  publish:
    name: Build and push Docker images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the Functions image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CoffeeNChill.Functions/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FUNCTIONS_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FUNCTIONS_IMAGE }}:v3.0

      - name: Build and push the API Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CoffeeNChill.ApiGateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GATEWAY_IMAGE }}:v3.0

  deploy:
    name: Deploy to the Azure VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new images and restart the stack over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/CLDV6212-FinalPoe
            git pull --ff-only origin main
            # Record the version to run in .env so a manual "docker compose up -d" keeps it.
            sed -i '/^IMAGE_TAG=/d' .env
            sed -i -e '$a\' .env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            docker compose pull
            docker compose up -d
            docker image prune -f
            # Wait until the gateway answers before reporting success.
            for i in $(seq 1 30); do
              if curl -fs http://localhost:5000/swagger/v1/swagger.json > /dev/null; then
                echo "Gateway is up - running ${IMAGE_TAG}"
                docker compose ps
                exit 0
              fi
              sleep 2
            done
            echo "Gateway did not start in time"
            docker compose logs gateway --tail 50
            exit 1

  verify:
    name: End-to-end tests on the live VPS
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Give the Functions host time to finish starting
        run: sleep 20

      - name: Run test-gateway.ps1 against the public URL
        shell: pwsh
        run: ./test-gateway.ps1 -BaseUrl "http://${{ secrets.VPS_HOST }}:5000"